{% extends 'base.html' %}
{% load static %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
    <div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 70vh;">
        <div class="text-center">
            <div class="mb-4">
                <i class="fa fa-triangle-exclamation text-warning display-1"></i>
            </div>
            <h1 class="display-4 fw-bold text-primary mb-3">404</h1>
            <h2 class="h4 text-muted mb-4">Oops! Page Not Found</h2>
            <p class="lead text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'main:home' %}" class="btn btn-primary px-4 py-2">
                    <i class="fa fa-home me-2"></i>Go Home
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2">
                    <i class="fa fa-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
{% endblock %}
